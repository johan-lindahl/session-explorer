<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f3a"/>
      <stop offset="1" stop-color="#171a21"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a5b"/>
      <stop offset="1" stop-color="#e7613a"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- squircle background -->
  <rect x="92" y="92" width="840" height="840" rx="196" fill="url(#bg)"/>
  <!-- subtle top sheen -->
  <rect x="92" y="92" width="840" height="420" rx="196" fill="#ffffff" opacity="0.04"/>

  <!-- terminal window -->
  <g filter="url(#soft)">
    <rect x="214" y="250" width="596" height="524" rx="56" fill="#11141b"/>
    <rect x="214" y="250" width="596" height="98" rx="56" fill="#222732"/>
    <rect x="214" y="300" width="596" height="48" fill="#222732"/>
    <!-- traffic lights -->
    <circle cx="270" cy="299" r="15" fill="#ff5f57"/>
    <circle cx="320" cy="299" r="15" fill="#febc2e"/>
    <circle cx="370" cy="299" r="15" fill="#28c840"/>
  </g>

  <!-- file tree -->
  <g stroke="#3a4150" stroke-width="9" stroke-linecap="round" fill="none">
    <!-- vertical spine -->
    <path d="M 300 430 V 690"/>
    <!-- branches -->
    <path d="M 300 470 H 360"/>
    <path d="M 300 560 H 360"/>
    <path d="M 300 650 H 360"/>
  </g>

  <!-- root folder -->
  <g transform="translate(258,398)">
    <path d="M0 14 Q0 0 14 0 H40 L56 18 H104 Q118 18 118 32 V70 Q118 84 104 84 H14 Q0 84 0 70 Z" fill="url(#accent)"/>
  </g>

  <!-- leaf nodes (session files) -->
  <g fill="#cdd4e0">
    <rect x="372" y="452" width="270" height="36" rx="18"/>
    <rect x="372" y="542" width="220" height="36" rx="18"/>
    <rect x="372" y="632" width="250" height="36" rx="18"/>
  </g>
  <!-- highlighted / active session -->
  <rect x="372" y="542" width="220" height="36" rx="18" fill="url(#accent)"/>

  <!-- terminal prompt chevron -->
  <g stroke="#67e08a" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 300 712 l 30 22 l -30 22"/>
  </g>
  <rect x="356" y="724" width="120" height="14" rx="7" fill="#67e08a"/>
</svg>
