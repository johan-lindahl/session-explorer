name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Textual is vendored under bin/_pkg/_vendor/, so only the test runners
      # need installing — never the runtime deps.
      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r test/requirements-dev.txt

      - name: Run pytest
        run: python -m pytest test/ -q

      # Install bats-core into a user-writable prefix (no root). `npm install -g`
      # hits EACCES on the Ubuntu runner's /usr/local prefix; this avoids npm,
      # sudo, and apt version skew, and behaves identically on macOS and Linux.
      - name: Install bats
        run: |
          git clone --depth 1 https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats-core"
          "$RUNNER_TEMP/bats-core/install.sh" "$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run bats (shell-facing CLI / install / hook)
        run: bats test/install.bats test/uninstall.bats test/hook.bats
